# `Agent` is cluster-scoped and owns its namespace. Keep its name stable.
# `__ORG__` and `__REVISION__` are rendered by deploy-catalog.
apiVersion: aioutfitter.com/v1alpha1
kind: Organization
metadata:
  name: __ORG__
spec:
  displayName: AI Outfitter
  credentialSecretName: organization-credentials
  agentCatalogs:
    - name: ai-outfitter-agents
      github: ai-outfitter/.agents
      revision: __REVISION__
---
apiVersion: aioutfitter.com/v1alpha1
kind: Agent
metadata:
  name: __ORG__-luce
spec:
  memberships:
    - organization: __ORG__
  profile:
    agent: luce-ai-outfitter
    harness: pi
  credentialSecretName: agent-credentials
  image: ghcr.io/ai-outfitter/outfitter:1.15.0
  catalogSync:
    enabled: true
  forge:
    username: luce-unsup
  channels: [github]
  github:
    notifyOrgs: [ai-outfitter]
    pollMs: 60000
    filters: [mention, assigned_issue, assigned_pr, review_requested, author]
  setup:
    # Luce pushes her branch with git over HTTPS: the runtime image has git but
    # no gh, curl, or wget. GIT_ASKPASS answers the credential prompt from the
    # environment, so the token never lands on disk and never appears in a
    # remote URL or in .git/config.
    #
    # Identity is derived from GITHUB_USER rather than configured separately —
    # <login>@users.noreply.github.com is the address GitHub attributes commits
    # with, so deriving it keeps attribution correct with nothing to set.
    - name: git-https-credential
      script: |
        set -eu
        umask 077

        : "${GITHUB_PERSONAL_ACCESS_TOKEN:?agent-credentials must provide GITHUB_PERSONAL_ACCESS_TOKEN}"
        : "${GITHUB_USER:?agent-credentials must provide GITHUB_USER}"

        askpass="${HOME}/.git-askpass"
        cat >"$askpass" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *[Uu]sername*) printf '%s\n' "$GITHUB_USER" ;;
          *[Pp]assword*) printf '%s\n' "$GITHUB_PERSONAL_ACCESS_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 0700 "$askpass"

        git config --global core.askPass "$askpass"
        # No credential helper: askPass is the only source, so a stale or wrong
        # token fails instead of silently reusing a cached one.
        git config --global credential.helper ''
        git config --global user.name "$GITHUB_USER"
        git config --global user.email "${GITHUB_USER}@users.noreply.github.com"
  workspace:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        requests.storage: 40Gi
        persistentvolumeclaims: "4"
        count/pods: "10"
        count/jobs.batch: "20"
        count/services: "5"
        count/configmaps: "20"
        count/secrets: "10"
    limitRange:
      container:
        defaultRequest:
          cpu: 100m
          memory: 256Mi
        default:
          cpu: "1"
          memory: 2Gi
    volume:
      size: 10Gi
