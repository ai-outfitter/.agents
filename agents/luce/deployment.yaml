# `Agent` is cluster-scoped and owns its namespace. Keep its name stable.
# `__ORG__` and `__REVISION__` are rendered by deploy-catalog.
apiVersion: aioutfitter.com/v1alpha1
kind: Organization
metadata:
  name: __ORG__
spec:
  displayName: AI Outfitter
  credentialSecretName: organization-credentials
  agentCatalogs:
    - name: ai-outfitter-agents
      github: ai-outfitter/.agents
      revision: __REVISION__
---
apiVersion: aioutfitter.com/v1alpha1
kind: Agent
metadata:
  name: __ORG__-luce
spec:
  memberships:
    - organization: __ORG__
  profile:
    agent: luce-ai-outfitter
    harness: pi
  credentialSecretName: agent-credentials
  envFrom:
    - configMapRef:
        name: luce-runtime
  setup:
    - name: catalog-bootstrap
      script: |
        set -eu
        source_uri="git+https://github.com/ai-outfitter/.agents.git"
        repository="${source_uri#git+}"
        revision="__REVISION__"
        profile="luce-ai-outfitter"
        cache_key="$(
          printf '%s#%s' "$source_uri" "$revision" \
            | base64 -w0 | tr '+/' '-_' | tr -d '='
        )"
        catalog="/workspace/.agents-cache/repos/$cache_key"
        temporary="${catalog}.tmp.$$"
        stale="${catalog}.stale.$$"
        trap 'rm -rf "$temporary" "$stale"' EXIT

        rm -rf "$temporary"
        mkdir -p "$temporary"
        git -C "$temporary" init --quiet
        git -C "$temporary" remote add origin "$repository"
        git -C "$temporary" fetch --quiet --depth 1 origin "$revision"
        git -C "$temporary" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$temporary" rev-parse HEAD)" = "$revision"
        test -f "$temporary/agents/$profile/agent.md"
        test -f "$temporary/mcp.json"

        if [ -e "$catalog" ]; then
          mv "$catalog" "$stale"
        fi
        mv "$temporary" "$catalog"
        rm -rf "$stale"

        cp_uri="git+https://github.com/ai-outfitter/community-profiles.git"
        cp_repo="${cp_uri#git+}"
        cp_ref="v1.4.0"
        cp_key="$(
          printf '%s#%s' "$cp_uri" "$cp_ref" \
            | base64 -w0 | tr '+/' '-_' | tr -d '='
        )"
        cp_catalog="/workspace/.agents-cache/repos/$cp_key"
        cp_tmp="${cp_catalog}.tmp.$$"
        trap 'rm -rf "$temporary" "$stale" "$cp_tmp"' EXIT
        rm -rf "$cp_tmp"
        mkdir -p "$cp_tmp"
        git -C "$cp_tmp" init --quiet
        git -C "$cp_tmp" remote add origin "$cp_repo"
        git -C "$cp_tmp" fetch --quiet --depth 1 origin "refs/tags/$cp_ref"
        git -C "$cp_tmp" checkout --quiet --detach FETCH_HEAD
        test -f "$cp_tmp/agents/luce/agent.md"
        if [ -e "$cp_catalog" ]; then rm -rf "$cp_catalog"; fi
        mv "$cp_tmp" "$cp_catalog"
    # Luce pushes her branch with git over HTTPS: the runtime image has git but
    # no gh, curl, or wget. GIT_ASKPASS answers the credential prompt from the
    # environment, so the token never lands on disk and never appears in a
    # remote URL or in .git/config.
    #
    # Identity is derived from GITHUB_USER rather than configured separately —
    # <login>@users.noreply.github.com is the address GitHub attributes commits
    # with, so deriving it keeps attribution correct with nothing to set.
    - name: git-https-credential
      script: |
        set -eu
        umask 077

        : "${GITHUB_PERSONAL_ACCESS_TOKEN:?agent-credentials must provide GITHUB_PERSONAL_ACCESS_TOKEN}"
        : "${GITHUB_USER:?agent-credentials must provide GITHUB_USER}"

        askpass="${HOME}/.git-askpass"
        cat >"$askpass" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *[Uu]sername*) printf '%s\n' "$GITHUB_USER" ;;
          *[Pp]assword*) printf '%s\n' "$GITHUB_PERSONAL_ACCESS_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 0700 "$askpass"

        git config --global core.askPass "$askpass"
        # No credential helper: askPass is the only source, so a stale or wrong
        # token fails instead of silently reusing a cached one.
        git config --global credential.helper ''
        git config --global user.name "$GITHUB_USER"
        git config --global user.email "${GITHUB_USER}@users.noreply.github.com"
  workspace:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        requests.storage: 40Gi
        persistentvolumeclaims: "4"
        count/pods: "10"
        count/jobs.batch: "20"
        count/services: "5"
        count/configmaps: "20"
        count/secrets: "10"
    limitRange:
      container:
        defaultRequest:
          cpu: 100m
          memory: 256Mi
        default:
          cpu: "1"
          memory: 2Gi
    volume:
      size: 10Gi
