# Vega's fleet declaration. deploy-catalog selects agents from clusters.yaml,
# so this file's existence is what puts Vega in the fleet once `vega` is
# named there, and CI renders __REVISION__ with the merge commit that
# produced it. Modeled on agents/luce/deployment.yaml — see that file for the
# comments on why the catalog is cloned into the pod, and why credentials and
# namespace are per-organization, per-agent.
#
# Bootstrap is an administrator's, not CI's: the agent-__ORG__-vega namespace
# and the agent-credentials Secret must exist before the first deploy, and the
# deploy role needs __ORG__-vega in its resourceNames. See deploy/RUNBOOK.md.
#
# `Agent` is CLUSTER-SCOPED and owns its namespace. `Agent/__ORG__-vega` gets
# namespace `agent-__ORG__-vega`, its own quota, and its own Secret, and can
# never collide with another organization's Vega on a shared cluster.
apiVersion: aioutfitter.com/v1alpha1
kind: Organization
metadata:
  name: __ORG__
spec:
  displayName: AI Outfitter
  agentCatalogs:
    # Identical, byte-for-byte after render, to the Organization block in
    # agents/luce/deployment.yaml and agents/outfitter-bot/deployment.yaml.
    # See that file's comment for why it is duplicated rather than defined
    # once.
    - name: ai-outfitter-agents
      github: ai-outfitter/.agents
      revision: __REVISION__
---
apiVersion: aioutfitter.com/v1alpha1
kind: Agent
metadata:
  name: __ORG__-vega
spec:
  memberships:
    - organization: __ORG__
  profile:
    agent: vega
    harness: pi
  credentials:
    # One Secret carries every credential this agent needs, projected as env.
    # Same shape as agents/luce/deployment.yaml:
    #
    #   GITHUB_NOTIFY_TOKEN            classic PAT, `notifications` only
    #   GITHUB_PERSONAL_ACCESS_TOKEN   fine-grained PAT, this org only
    #   GITHUB_USER                    the machine account's login
    #   GITHUB_NOTIFY_ORGS             ai-outfitter — see deploy/RUNBOOK.md
    - secret: agent-credentials
      as: env
  setup:
    # The runtime is offline (`outfitter run --strict`): it never fetches a
    # catalog at startup. This step clones the org catalog at the pinned
    # revision into the exact path Outfitter derives for a remote source, and
    # asserts the clone carries the `vega` profile before the agent container
    # starts on it.
    - name: catalog-bootstrap
      script: |
        set -eu
        source_uri="git+https://github.com/ai-outfitter/.agents.git"
        repository="${source_uri#git+}"
        revision="__REVISION__"
        profile="vega"
        cache_key="$(
          printf '%s#%s' "$source_uri" "$revision" \
            | base64 -w0 | tr '+/' '-_' | tr -d '='
        )"
        catalog="/workspace/.agents-cache/repos/$cache_key"
        temporary="${catalog}.tmp.$$"
        stale="${catalog}.stale.$$"
        trap 'rm -rf "$temporary" "$stale"' EXIT

        rm -rf "$temporary"
        mkdir -p "$temporary"
        git -C "$temporary" init --quiet
        git -C "$temporary" remote add origin "$repository"
        git -C "$temporary" fetch --quiet --depth 1 origin "$revision"
        git -C "$temporary" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$temporary" rev-parse HEAD)" = "$revision"
        test -f "$temporary/agents/$profile/agent.md"
        test -f "$temporary/mcp.json"

        if [ -e "$catalog" ]; then
          mv "$catalog" "$stale"
        fi
        mv "$temporary" "$catalog"
        rm -rf "$stale"
    # Vega only reviews — it never pushes a branch — so it needs no git
    # credential helper, unlike Luce.
  workspace:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        requests.storage: 40Gi
        persistentvolumeclaims: "4"
        count/pods: "10"
        count/jobs.batch: "20"
        count/services: "5"
        count/configmaps: "20"
        count/secrets: "10"
    limitRange:
      container:
        defaultRequest:
          cpu: 100m
          memory: 256Mi
        default:
          cpu: "1"
          memory: 2Gi
    volume:
      size: 10Gi
