# Resident deployment is retired in this contributor catalog. Keep this workflow
# as an explanatory no-op for pushes and manual runs; no AWS identity is assumed.
# Canonical residents are deployed by Unsupervisedcom/.agents.
name: deploy

on:
  push:
    branches:
      - main
    paths:
      - agents/**
      - clusters.yaml
      - mcp.json
      - models.json
      - settings.yml
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: catalog-deploy
  cancel-in-progress: false

jobs:
  # This catalog retains contributor configuration and the outfitter
  # Organization, but must never recreate the retired duplicate Agents.
  # Canonical deployment is owned by Unsupervisedcom/.agents.
  retired:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Explain canonical resident ownership
        run: echo 'Resident deployments are owned by Unsupervisedcom/.agents; this catalog deploys no Agents.'
