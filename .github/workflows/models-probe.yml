# Temporary probe: is GitHub Models inference reachable with this repo's
# workflow token? Delete after debugging.
name: Models probe
on:
  workflow_dispatch: {}
permissions:
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        run: |
          curl -sS -o /tmp/resp.json -w "HTTP %{http_code}\n" \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}]}'
          cat /tmp/resp.json | head -c 600; echo
        env:
          GITHUB_TOKEN: ${{ github.token }}
