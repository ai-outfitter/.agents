# Temporary probe: which GitHub Models surfaces does this repo's workflow
# token reach? Delete after debugging.
name: Models probe
on:
  workflow_dispatch: {}
permissions:
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Catalog list (models.github.ai)
        run: |
          curl -sS -o /tmp/cat.json -w "catalog: HTTP %{http_code}\n" \
            https://models.github.ai/catalog/models \
            -H "Authorization: Bearer $GITHUB_TOKEN"
          head -c 300 /tmp/cat.json; echo
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Inference (models.github.ai)
        run: |
          curl -sS -o /tmp/new.json -w "new-endpoint: HTTP %{http_code}\n" \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}]}'
          head -c 300 /tmp/new.json; echo
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Inference (models.inference.ai.azure.com, legacy)
        run: |
          curl -sS -o /tmp/old.json -w "old-endpoint: HTTP %{http_code}\n" \
            https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}]}'
          head -c 300 /tmp/old.json; echo
        env:
          GITHUB_TOKEN: ${{ github.token }}
