# Batch all selected Dependabot PRs through a repository's GitHub merge queue.
# The trusted default-branch workflow never checks out or executes PR code.
name: Dependabot merge queue

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name in the ai-outfitter organization
        required: true
        default: outfitter
        type: string
      pull_requests:
        description: Optional ordered PR numbers (comma or space separated); blank selects every open Dependabot PR
        required: false
        type: string
      execute:
        description: Rebase and queue the selected PRs (leave off to preview)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependabot-merge-queue-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  queue:
    name: Rebase and queue
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate target repository
        env:
          TARGET_REPOSITORY_NAME: ${{ inputs.repository }}
        run: |
          if [[ ! "$TARGET_REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Repository must be a single ai-outfitter repository name."
            exit 1
          fi

      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OUTFITTER_APP_ID }}
          private-key: ${{ secrets.OUTFITTER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: ${{ inputs.execute && 'write' || 'read' }}
          permission-pull-requests: ${{ inputs.execute && 'write' || 'read' }}
          repositories: ${{ inputs.repository }}

      - name: Check out trusted queue controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preview or execute Dependabot batch
        env:
          EXECUTE: ${{ inputs.execute }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUESTS: ${{ inputs.pull_requests }}
          TARGET_REPOSITORY: ${{ format('{0}/{1}', github.repository_owner, inputs.repository) }}
        run: node .github/scripts/queue-dependabot-prs.mjs
