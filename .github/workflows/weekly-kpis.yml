# Weekly org KPI report. A manual dispatch updates the current ISO week's
# draft report (so the pipeline can be tested any day); the Sunday scheduled
# run finalizes it. See skills/reports/SKILL.md (report_kind: weekly-kpi).
# Auth: workflow GITHUB_TOKEN only — gh/git plus GitHub Models inference via
# `models: read`. The provider config points at the legacy endpoint
# models.inference.ai.azure.com because the new models.github.ai/inference
# gateway 403s Actions tokens from enterprise-owned org repos.
name: Weekly KPIs
on:
  schedule:
    - cron: "0 20 * * 0" # Sundays 20:00 UTC — finalizes the week's report
  workflow_dispatch: {} # manual run — refreshes the current week's draft

permissions:
  contents: write
  models: read

concurrency:
  group: weekly-kpis
  cancel-in-progress: false

jobs:
  kpis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Models provider for pi
        run: |
          mkdir -p "$HOME/.pi/agent"
          cp .github/models.json "$HOME/.pi/agent/models.json"

      - uses: ai-outfitter/actions@v1
        with:
          profile: github-actions
          # Absolute path: a bare relative path is written as-is into the
          # runner's ~/.outfitter/settings.yml and resolves against the wrong
          # root (ai-outfitter/actions#14 fixes this).
          profile-source: ${{ github.workspace }}/profiles
          git-user-name: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com
          prompt: |
            Handle this GitHub event using the profile's system-prompt rules.
            Treat trigger_context as routing metadata, select only the relevant
            skill, then gather the data that skill needs with trusted tools.

            FIRST STEP, before anything else: activate the reports skill and
            read its SKILL.md in full. Follow that skill's flow for the
            trigger_context report_kind exactly — its collector script and
            template are the only sanctioned way to produce the report. Do
            not invent data sources or flows that the skill does not name.

            This run is non-interactive: no one can answer questions. Do not
            ask for confirmation at any point. Carry the skill's workflow all
            the way through — gather the data, write the report, commit it,
            and push — then print a summary of what you did. If some data is
            inaccessible, note it in the report and continue; never stop to ask.

            trigger_context:
              repository: ${{ github.repository }}
              event_name: ${{ github.event_name }}
              report_kind: weekly-kpi
